<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LostWorld TCG — Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+Thai:wght@400;600;800&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 0%, #1d1828, #0b0a0f 65%); color: #f1ead8; font-family: 'Noto Serif Thai', serif; }
  header { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px;
    background: #0b0a0fe6; backdrop-filter: blur(8px); border-bottom: 1px solid #2a2433; }
  h1 { margin: 0 8px 0 0; font: 800 16px 'Cinzel', serif; letter-spacing: 2px; color: #e8c56a; }
  input, select { font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 999px; background: #1d1925; color: #f1ead8; border: 2px solid #3a3346; }
  input[type=search] { flex: 1 1 160px; min-width: 120px; max-width: 280px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: flex; align-items: center; gap: 6px; font: 600 13px 'Noto Serif Thai', serif; padding: 6px 12px; border-radius: 999px;
    background: #14111a; color: #f1ead8; border: 2px solid #3a3346; cursor: pointer; }
  .chip img { width: 20px; height: 20px; }
  .chip.on { border-color: var(--c, #e8c56a); background: #231e2c; }
  .count { margin-left: auto; font-size: 13px; color: #8d8299; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 22px 18px; padding: 24px 16px 48px; max-width: 1400px; margin: 0 auto; }
  /* mini card: frame + art + cost / element / stats overlays */
  a.mini { position: relative; display: block; aspect-ratio: 630 / 880; border-radius: 12px; text-decoration: none; color: inherit;
    border: 3px solid var(--c); background: #0f0d14; box-shadow: 0 8px 18px #0008; transition: transform .15s, box-shadow .15s; overflow: hidden; }
  a.mini:hover, a.mini:focus-visible { transform: translateY(-6px) scale(1.03); box-shadow: 0 14px 28px #000a, 0 0 22px color-mix(in srgb, var(--c) 45%, transparent); outline: none; }
  .mini > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mini::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 55%, #0b0a0fee 92%); pointer-events: none; }
  .cost { position: absolute; left: 6px; top: 6px; z-index: 2; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: #14203f; border: 2px solid #e8c56a; font: 800 17px 'Cinzel', serif; color: #fff4dc; }
  .el { position: absolute; right: 6px; top: 6px; z-index: 2; width: 34px; height: 34px; filter: drop-shadow(0 2px 3px #000a); }
  .el img { width: 100%; height: 100%; display: block; }
  .nm { position: absolute; left: 8px; right: 8px; bottom: 34px; z-index: 2; text-align: center; font-weight: 800; font-size: 15px; line-height: 1.2; text-shadow: 0 2px 6px #000; }
  .nm small { display: block; font: 600 9px 'Cinzel', serif; letter-spacing: 2px; color: #cfc4a8; margin-top: 2px; }
  .st { position: absolute; bottom: 4px; z-index: 2; min-width: 34px; height: 28px; padding: 0 8px; display: flex; align-items: center; justify-content: center;
    font: 800 16px 'Cinzel', serif; color: #fff4dc; border: 2px solid #e8c56a; }
  .st.p { left: 4px; background: #7a2416; border-radius: 14px 14px 14px 4px; }
  .st.h { right: 4px; background: #1e4a3a; border-radius: 14px 14px 4px 14px; }
  .rar { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 2; width: 10px; height: 10px; border-radius: 50%; background: var(--rc); box-shadow: 0 0 8px var(--rc); margin-bottom: 9px; }
  /* cards without full art: the whole card face, drawn at 630x880 and scaled to the tile (--k set by JS) */
  a.mini.full { border: 0; border-radius: 14px; background: #16131c; }
  a.mini.full::after { display: none; }
  .fc { position: absolute; left: 0; top: 0; width: 630px; height: 880px; transform: scale(var(--k, .3)); transform-origin: 0 0; padding: 18px; background: #16131c; }
  .fc-in { width: 100%; height: 100%; border: 3px solid var(--a); border-radius: 16px; padding: 14px; background: #1d1925; display: flex; flex-direction: column; gap: 12px; }
  .fc-row { display: flex; align-items: center; gap: 12px; }
  .fc-cost { width: 64px; height: 64px; flex: none; transform: rotate(45deg); background: #0f0d14; border: 3px solid var(--a); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .fc-cost span { transform: rotate(-45deg); font: 800 30px 'Cinzel', serif; color: #f5dc96; }
  .fc-names { flex: 1; padding-left: 10px; min-width: 0; }
  .fc-th { font-size: 30px; font-weight: 800; line-height: 1.15; color: #f5ecd2; }
  .fc-en { font: 600 14px 'Cinzel', serif; letter-spacing: 3px; color: #b8ab8c; }
  .fc-el { width: 72px; height: 72px; flex: none; filter: drop-shadow(0 3px 4px #000a); }
  .fc-el img { width: 100%; height: 100%; display: block; }
  .fc-art { flex: 1; min-height: 0; border-radius: 10px; border: 2px solid #4a4256; background: #0f0d14 center/cover; position: relative; }
  .fc-rar { position: absolute; left: 12px; top: 12px; padding: 4px 12px; border-radius: 999px; background: #0b0a0fcc; border: 1px solid var(--a); font: 600 12px 'Cinzel', serif; letter-spacing: 2px; color: #f5dc96; }
  .fc-type { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-radius: 8px; background: #2a2433; border: 1px solid #4a4256; font-size: 15px; font-weight: 600; color: #e9dfc3; }
  .fc-type em { font: normal 13px 'Cinzel', serif; letter-spacing: 2px; color: #b8ab8c; }
  .fc-ab { height: 196px; padding: 14px 16px; border-radius: 10px; background: #efe6cf; color: #2a2230; display: flex; flex-direction: column; gap: 8px; font-size: 16px; line-height: 1.55; overflow: hidden; }
  .fc-fl { margin-top: auto; font-size: 14px; font-style: italic; color: #5e5266; }
  .fc-stats { display: flex; justify-content: space-between; padding: 0 4px; }
  .fc-orb { width: 58px; height: 58px; border: 3px solid #e8c56a; display: flex; align-items: center; justify-content: center; font: 800 28px 'Cinzel', serif; color: #fff4dc; }
  /* spell variants */
  a.mini.sp:not(.full) { border-style: double; border-width: 6px; }
  .mini.sp .rar { margin-bottom: 30px; }
  .spmark { position: absolute; left: 0; right: 0; bottom: 6px; z-index: 2; text-align: center; font: 800 13px 'Cinzel', serif; letter-spacing: 5px; color: #fff; text-shadow: 0 2px 5px #000; }
  .fc.sp { background: none; padding: 20px 18px; }
  .fc.sp::before, .fc.sp::after { content: ''; position: absolute; z-index: 3; left: -4px; right: -4px; height: 34px; border-radius: 17px; background: linear-gradient(#5a3a1c, #c9934f 30%, #f0c98a 45%, #a8733a 70%, #4a2e14); box-shadow: 0 6px 12px #000a; }
  .fc.sp::before { top: 4px; } .fc.sp::after { bottom: 4px; }
  .fc.sp .fc-in { clip-path: polygon(46px 0, calc(100% - 46px) 0, 100% 46px, 100% calc(100% - 46px), calc(100% - 46px) 100%, 46px 100%, 0 calc(100% - 46px), 0 46px); border-radius: 0; }
  .fc.sp .fc-art { flex: none !important; align-self: center; width: 72%; aspect-ratio: 1; border-radius: 50% !important; box-shadow: 0 0 0 4px #0b0a10, 0 0 24px color-mix(in srgb, var(--a) 60%, transparent); }
  .fc.sp .fc-ab { background: linear-gradient(#f4e7c6, #e2cd9c) !important; color: #3a2a14; }
  .fc.sp .fc-in { border: 6px double var(--a); padding: 11px; background: radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--a) 24%, #1d1925), #17131f 72%); box-shadow: inset 0 0 50px color-mix(in srgb, var(--a) 24%, transparent); }
  .fc.sp .fc-cost { transform: none; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--a) 60%, #fff), color-mix(in srgb, var(--a) 65%, #000)); }
  .fc.sp .fc-cost span { transform: none; color: #fff; }
  .fc.sp .fc-art { border-radius: 150px 150px 10px 10px / 90px 90px 10px 10px; border: 3px solid var(--a); }
  .fc.sp .fc-rar { top: auto; bottom: 14px; left: 50%; transform: translateX(-50%); }
  .fc.sp .fc-type { background: linear-gradient(90deg, color-mix(in srgb, var(--a) 50%, #000), color-mix(in srgb, var(--a) 16%, #14111a)); border-color: var(--a); color: #fff; }
  .fc-lv { padding: 6px 12px; border-radius: 8px; background: #2a2230; color: #f5dc96; font-size: 15px; line-height: 1.5; border: 1px solid #c8962e; }
  .fc-lv b { color: #e8c56a; }
  .fc.sp .fc-ab { background: linear-gradient(#eaecf8, #d3d8ee); }
  .fc-spell { height: 58px; flex: none; display: flex; align-items: center; justify-content: center; font: 800 22px 'Cinzel', serif; letter-spacing: 8px; color: #fff; border-top: 2px solid var(--a); border-bottom: 2px solid var(--a);
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--a) 65%, #000) 18%, color-mix(in srgb, var(--a) 65%, #000) 82%, transparent); }
  /* small normal-face card pinned bottom-left of full-art tiles */
  .nthumb { position: absolute; left: 6px; bottom: 6px; z-index: 3; width: 26%; aspect-ratio: 630 / 880; border-radius: 5px; overflow: hidden;
    border: 2px solid #f1ead8; box-shadow: 0 4px 10px #000c; transform-origin: bottom left; transition: transform .15s; }
  .mini:hover .nthumb { transform: scale(1.12); }
  /* make room for the thumbnail: name / SPELL label / power badge / rarity dot sit to its right */
  .mini:not(.full) .nm, .mini:not(.full) .spmark { left: calc(26% + 14px); }
  .mini:not(.full) .st.p { left: calc(26% + 14px); }
  .mini:not(.full) .rar { left: 63%; }
  .nthumb .fc { transform: scale(var(--k2, .06)); }
  /* hero variants */
  a.mini.hero { border-color: #e8c56a; box-shadow: 0 8px 18px #0008, 0 0 20px #e8c56a66; }
  .hmark { position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 4; padding: 1px 16px; font: 800 9px 'Cinzel', serif; letter-spacing: 4px; color: #2a1d05; white-space: nowrap;
    background: linear-gradient(#fff3c4, #e8c56a 55%, #b8862e); clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 50%, 100% 100%, 0 100%, 6px 50%); }
  .mini.hero::before { content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none; mix-blend-mode: overlay;
    background: linear-gradient(115deg, transparent 38%, #fffc 48%, #ffe9a0cc 52%, transparent 62%); background-size: 260% 100%; animation: sweep 4.5s ease-in-out infinite; }
  @keyframes sweep { 0% { background-position: 130% 0; } 55%, 100% { background-position: -130% 0; } }
  @media (prefers-reduced-motion: reduce) { .mini.hero::before { animation: none; } }
  .fc.hero { background: linear-gradient(145deg, #fff3c4 0%, #c8962e 28%, #f5dc96 50%, #8a6420 78%, #e8c56a 100%); }
  .fc.hero .fc-in { border-color: #e8c56a; }
  .fc.hero .fc-cost { background: linear-gradient(135deg, #f5dc96, #b8862e); border-color: #fff3c4; }
  .fc.hero .fc-cost span { color: #2a1d05; }
  .fc.hero .fc-th { background: linear-gradient(#fff8dc, #e8c56a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mini.extra:not(.hero) .hmark, .fc.extra:not(.hero) .fc-hm { background: linear-gradient(#f4f6fb, #b9c0d3 55%, #7f889f); }
  .lvbadge { position: absolute; right: 6px; top: 44px; z-index: 3; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: #0b0a0fcc; border: 2px solid #e8c56a; color: #f5dc96; font: 800 14px system-ui; }
  .fc-hm { position: absolute; top: 3px; left: 50%; transform: translateX(-50%); padding: 3px 34px 2px; font: 800 13px 'Cinzel', serif; letter-spacing: 6px; color: #2a1d05; white-space: nowrap;
    background: linear-gradient(#fff3c4, #e8c56a 55%, #b8862e); clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 50%, 100% 100%, 0 100%, 12px 50%); }
  /* Three.js ambient background + lightbox */
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  main.grid { position: relative; z-index: 1; }
  #lb { position: fixed; inset: 0; z-index: 50; visibility: hidden; opacity: 0; background: rgba(7, 6, 12, .5);
    backdrop-filter: blur(14px) saturate(1.15); -webkit-backdrop-filter: blur(14px) saturate(1.15); transition: opacity .3s, visibility 0s .3s; }
  #lb.open { visibility: visible; opacity: 1; transition: opacity .3s; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #lb iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  @media (prefers-reduced-motion: reduce) { #lb { transition: none; } }
  .fc-spd { margin-left: 8px; padding: 0 10px; border-radius: 999px; font-size: 12px; color: #14111a; background: var(--k); }
  .fc-kws { display: flex; flex-wrap: wrap; gap: 6px; }
  .fc-kw { padding: 1px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; color: #fff; background: color-mix(in srgb, var(--k) 70%, #000); border: 1px solid var(--k); }
  .mkws { position: absolute; left: 0; right: 0; bottom: 70px; z-index: 2; display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; padding: 0 6px; }
  .mini:not(.full) .mkws { left: calc(26% + 14px); }
  .mkws i { font-style: normal; font-size: 10px; font-weight: 700; padding: 0 7px; border-radius: 999px; color: #fff; background: color-mix(in srgb, var(--k) 70%, #000); border: 1px solid var(--k); }

  /* ===== readable numbers (phone): compact full-art tile, sizes scale with the tile width (cqw) ===== */
  a.mini { container-type: inline-size; }
  .mini::after { background: linear-gradient(transparent 48%, #0b0a0fd9 78%, #0b0a0f 97%); }
  .mini .cost { left: 3cqw; top: 3cqw; width: 21cqw; height: 21cqw; font-size: 12.5cqw; border-width: max(2px, 1.2cqw); text-shadow: 0 1px 0 #000, 0 0 6px #000; box-shadow: 0 2px 6px #000a; }
  .mini .el { right: 3cqw; top: 3cqw; width: 19cqw; height: 19cqw; }
  .mini .nm, .mini:not(.full) .nm { left: 4cqw; right: 4cqw; bottom: 31cqw; font-size: 8.5cqw; }
  .mini .nm small { font-size: 4.3cqw; letter-spacing: .8cqw; }
  .mkws, .mini:not(.full) .mkws { position: absolute; left: 4cqw; right: 4cqw; bottom: 22cqw; z-index: 2; display: flex; justify-content: center; flex-wrap: wrap; gap: 1.5cqw; }
  .mkws .mkw { font-style: normal; font-weight: 700; font-size: 4.8cqw; line-height: 1.5; padding: 0 3cqw; border-radius: 999px; color: #fff; white-space: nowrap;
    background: color-mix(in srgb, var(--k) 70%, #000); border: max(1px, .5cqw) solid var(--k); box-shadow: 0 1px 4px #000a; }
  .mini .st, .mini:not(.full) .st.p { bottom: 3cqw; min-width: 20cqw; height: 18cqw; padding: 0 2.5cqw; font-size: 12.5cqw; border-width: max(2px, 1cqw);
    color: #fff; text-shadow: 0 1px 0 #000, 0 0 6px #000; box-shadow: 0 2px 6px #000a; }
  .mini .st.p, .mini:not(.full) .st.p { left: 3cqw; background: radial-gradient(circle at 35% 30%, #e0603a, #8a2512 70%); }
  .mini .st.h { right: 3cqw; background: radial-gradient(circle at 35% 30%, #3fa06e, #164a33 70%); }
  .mini .rar, .mini:not(.full) .rar, .mini.sp .rar { left: 50%; bottom: 7cqw; margin: 0; width: 4cqw; height: 4cqw; }
  .mini .spmark, .mini:not(.full) .spmark { left: 0; right: 0; bottom: 12cqw; font-size: 5cqw; letter-spacing: 1.6cqw; }
  .mini.sp .rar { bottom: 6cqw; }
  .nthumb { left: 3cqw; top: 27cqw; bottom: auto; width: 22cqw; transform-origin: top left; }
  .lvbadge { top: 25cqw; right: 3cqw; width: 12cqw; height: 12cqw; font-size: 7cqw; }
  .hmark { font-size: 4.5cqw; padding: .3cqw 8cqw; letter-spacing: 1.5cqw; }
  /* normal card face (used for cards without full art and for the thumbnails): bigger numbers too */
  .fc-cost { width: 78px; height: 78px; }
  .fc-cost span { font-size: 44px; color: #fff4dc; text-shadow: 0 2px 0 #000, 0 0 8px #000c; }
  .fc-el { width: 78px; height: 78px; }
  .fc-orb { width: 80px; height: 80px; border-width: 4px; font-size: 46px; color: #fff; text-shadow: 0 2px 0 #000, 0 0 8px #000c; box-shadow: 0 4px 10px #000a; }
  .fc-p { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #e0603a, #8a2512 70%); }
  .fc-h { border-radius: 14px; background: radial-gradient(circle at 35% 30%, #3fa06e, #164a33 70%); }
  .fc-kws { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: -34px 0 -4px; position: relative; z-index: 3; }
  .fc.sp .fc-rar { left: 14px; bottom: 14px; transform: none; }
  .fc-kw { font-style: normal; padding: 1px 14px; border-radius: 999px; font-weight: 700; font-size: 15px; line-height: 1.55; box-shadow: 0 2px 6px #000a; color: #fff; background: color-mix(in srgb, var(--k) 70%, #000); border: 1px solid var(--k); }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px; padding: 16px 10px 40px; } }
  /* keyword / speed badges as icons only (like the in-game board view); full names are in the lightbox */
  .mkws .mkw, .fc-kws .fc-kw { display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 50%; color: #fff; font-size: 0;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--k) 75%, #fff), color-mix(in srgb, var(--k) 55%, #000)); border: max(1px, .6cqw) solid #fff6; box-shadow: 0 2px 6px #000b; }
  .mkws .mkw { width: 12.5cqw; height: 12.5cqw; }
  .mkws .mkw svg { width: 8cqw; height: 8cqw; filter: drop-shadow(0 1px 1px #000a); }
  .fc-kws { gap: 14px; margin-top: -78px; }
  .fc-kws .fc-kw { width: 74px; height: 74px; border-width: 4px; }
  .fc-kws .fc-kw svg { width: 46px; height: 46px; filter: drop-shadow(0 1px 1px #000a); }
  .empty { grid-column: 1 / -1; text-align: center; color: #8d8299; padding: 60px 0; }
  nav.links { display: flex; gap: 12px; font-size: 13px; }
  nav.links a { color: #b8ab8c; text-decoration: none; } nav.links a:hover { color: #e8c56a; }
</style>

<body>
<header>
  <h1>GALLERY</h1>
  <input id="q" type="search" placeholder="ค้นหาชื่อ / รหัส" aria-label="ค้นหา">
  <div class="chips" id="els"></div>
  <div class="costs" id="costs"><span class="lbl">ค่าร่าย</span></div>
  <div class="chips" id="kinds"><button class="chip on" data-kind="" style="--c:#e8c56a">ทั้งหมด</button><button class="chip" data-kind="char" style="--c:#e8c56a">⚔ Character</button><button class="chip" data-kind="spell" style="--c:#b07cff">✦ Spell</button></div>
  <button class="chip" id="heroOnly" style="--c:#e8c56a">★ Hero</button>
  <button class="chip" id="extraOnly" style="--c:#b9c0d3">Extra deck</button>
  <select id="kwSel" aria-label="keyword"><option value="">ทุก keyword</option></select>
  <select id="tagSel" aria-label="แท็ก"><option value="">ทุกแท็ก</option></select>
  <select id="rar" aria-label="ความหายาก"><option value="">ทุกระดับ</option><option>COMMON</option><option>RARE</option><option>EPIC</option><option>LEGEND</option></select>
  <select id="sort" aria-label="เรียงลำดับ"><option value="id">เรียงตามรหัส</option><option value="cost">ค่าร่าย</option><option value="power">พลังโจมตี</option><option value="health">พลังชีวิต</option></select>
  <span class="count" id="count"></span>
  <nav class="links"><a href="play.html">▶ เล่นเกม</a><a href="deck.html">จัดเด็ค</a><a href="index.html">Preview</a><a href="crop.html#cards">แก้ไขการ์ด</a></nav>
</header>
<canvas id="bg"></canvas>
<main class="grid" id="grid"></main>
<div id="lb" aria-hidden="true"><canvas id="fx"></canvas><iframe id="lbFrame" title="การ์ด" src="index.html?embed=1&lb=1"></iframe></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" async></script>
<script src="elements.js"></script>
<script>
  const RC = { COMMON: '#b8ab8c', RARE: '#4aa3df', EPIC: '#9b6bd6', LEGEND: '#e8c56a' };
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let cards = [], elFilter = new Set(), costFilter = new Set();

  $('els').innerHTML = Object.entries(ELEMENTS).map(([k, e]) => `<button class="chip" data-el="${k}" style="--c:${e.color}"><img src="${e.icon}" alt="">${e.th}</button>`).join('');

        const x = cx + Math.cos(a) * R.width * .5, y = cy + Math.sin(a) * R.height * .5, sp = rnd(160, 380);
        emit('add', x, y, Math.cos(a) * sp, Math.sin(a) * sp, rnd(.5, .9), rnd(6, 16), pick(cfg.colors), 1, 1);
      }
    }
    fx.start = (card, R, withBurst) => { fx.cfg = FX[card.element] || FX.fire; fx.hero = isHero(card); fx.rect = R; fx.on = true; if (withBurst) burst(fx.cfg, R); kick(); };
    fx.stop = () => { fx.on = false; };
    let running = false, t0 = 0;
    function kick() { if (!running) { running = true; t0 = performance.now(); requestAnimationFrame(loop); } }
    function loop(now) {
      const dt = Math.min((now - t0) / 1000, .05); t0 = now;
      const R = fx.rect;
      if (fx.on && R) {
        fx.acc += fx.cfg.rate * dt * (innerWidth < 700 ? .6 : 1); const n = fx.acc | 0; fx.acc -= n; if (n) spawn(fx.cfg, n, R);
        if (fx.hero) { fx.heroAcc += 18 * dt; const h = fx.heroAcc | 0; fx.heroAcc -= h;
          for (let k = 0; k < h; k++) emit('add', 0, 0, 0, 0, rnd(2, 3), rnd(5, 10), pick(['#fff3c4', '#e8c56a', '#ffd86b']), 1, 2, { ang: Math.random() * 6.28, spd: rnd(.6, 1) }); }
      }
      let alive = 0;
      for (const P of Object.values(pools)) {
        for (let i = 0; i < P.n; i++) {
          if (P.life[i] <= 0) { P.alpha[i] = 0; P.size[i] = 0; continue; }
          alive++; P.life[i] -= dt; const t = 1 - P.life[i] / P.max[i];
          if (P.mode[i] === 2 && R) {          // orbit around the card
            P.ang[i] += P.spd[i] * dt; const cx = (R.left + R.right) / 2, cy = (R.top + R.bottom) / 2, k = 1 + t * .12;
            P.pos[i * 3] = cx + Math.cos(P.ang[i]) * R.width * .62 * k; P.pos[i * 3 + 1] = cy + Math.sin(P.ang[i]) * R.height * .56 * k;
          } else {
            if (P.mode[i] === 1) { P.vx[i] *= 1 - 2.5 * dt; P.vy[i] *= 1 - 2.5 * dt; }                       // burst: slow down
            if (P.mode[i] === 3) { P.pos[i * 3] += rnd(-1, 1) * 18 * dt * 10; P.pos[i * 3 + 1] += rnd(-1, 1) * 18 * dt * 10; } // spark jitter
            if (fx.cfg && fx.cfg.drag) { P.vx[i] *= 1 - fx.cfg.drag * dt; }
            const wob = fx.cfg && fx.cfg.wob ? Math.sin(now / 400 + P.seed[i]) * fx.cfg.wob * dt : 0;
            P.pos[i * 3] += P.vx[i] * dt + wob; P.pos[i * 3 + 1] += P.vy[i] * dt;
          }
          const fade = Math.min(1, t * 6) * Math.min(1, (1 - t) * 3);
          P.alpha[i] = P.base[i] * fade * (P.mode[i] === 4 ? .55 + .45 * Math.sin(now / 160 + P.seed[i] * 3) : 1);
          P.size[i] = P.sz[i] * (P.mode[i] === 1 ? 1 - t * .6 : 1);
        }
        P.g.attributes.position.needsUpdate = P.g.attributes.color.needsUpdate = P.g.attributes.size.needsUpdate = P.g.attributes.alpha.needsUpdate = true;
      }
      renderer.render(scene, cam);
      if (fx.on || alive) requestAnimationFrame(loop); else { running = false; renderer.clear(); }
    }
    fx.ready = true;
  }
  const cardById = id => cards.find(c => c.id === id);
  const stageRect = () => lbFrame.contentDocument.getElementById('stage').getBoundingClientRect();
  (function waitThree(n) { if (window.THREE) { initBG(); initFX(); } else if (n > 0) setTimeout(() => waitThree(n - 1), 200); })(25);
</script>
