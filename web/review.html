<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LostWorld TCG — ตรวจความหมาย effect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600;800&display=swap">
<style>
  :root { --gold: #e8c56a; --line: #3a3346; --bg2: #1d1925; --ok: #6fcf97; --warn: #ff9b7a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0a0f; color: #f1ead8; font: 15px/1.6 system-ui, 'Noto Sans Thai', sans-serif; }
  header { position: sticky; top: 0; z-index: 5; padding: 12px 16px; background: #100e15ee; backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 860px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  h1 { margin: 0; font: 800 17px 'Noto Serif Thai', serif; color: var(--gold); flex: 1; min-width: 200px; }
  .prog { flex-basis: 100%; height: 8px; border-radius: 99px; background: #231e2c; overflow: hidden; }
  .prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--ok)); width: 0; transition: width .3s; }
  .count { font-size: 13px; color: #b8ab8c; }
  .seg { display: flex; gap: 6px; }
  .seg button, a.btn { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: #14111a; color: inherit; cursor: pointer; text-decoration: none; }
  .seg button.on { border-color: var(--gold); color: var(--gold); }
  main { max-width: 860px; margin: 0 auto; padding: 16px 16px 80px; display: flex; flex-direction: column; gap: 14px; }
  h2 { margin: 18px 0 2px; font: 800 16px 'Noto Serif Thai', serif; color: var(--gold); }
  .intro { color: #b8ab8c; font-size: 14px; margin: 0; }
  .q { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .q.done { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
  .qh { display: flex; gap: 12px; align-items: flex-start; }
  .qid { flex: none; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #231e2c; color: var(--gold); }
  .q.done .qid { background: color-mix(in srgb, var(--ok) 30%, #14111a); color: var(--ok); }
  .topic { font-weight: 700; }
  .card { display: flex; gap: 12px; padding: 10px; border-radius: 10px; background: #14111a; }
  .card img { width: 64px; aspect-ratio: 630 / 880; object-fit: cover; border-radius: 6px; flex: none; background: #0f0d14; }
  .card .t { font-size: 13px; color: #cfc4a8; }
  .card .n { font-weight: 700; color: #f5ecd2; }
  .card ul { margin: 4px 0 0; padding-left: 18px; }
  .qt { font-size: 15px; }
  .opts { display: flex; flex-direction: column; gap: 6px; }
  .opt { text-align: left; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: #14111a; color: inherit; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
  .opt:hover { border-color: #6b6178; }
  .opt .r { flex: none; width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; border: 2px solid #6b6178; }
  .opt.on { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, #14111a); }
  .opt.on .r { border-color: var(--ok); background: radial-gradient(circle, var(--ok) 45%, transparent 50%); }
  .opt small { color: var(--gold); font-size: 11px; margin-left: 6px; }
  textarea { font: inherit; width: 100%; min-height: 44px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: #0f0d14; color: inherit; resize: vertical; }
  .rel { font-size: 12px; color: #8d8299; }
  #msg { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 8px 16px; border-radius: 99px; background: #14111aee; border: 1px solid var(--line); font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #msg.show { opacity: 1; } #msg.bad { color: var(--warn); border-color: var(--warn); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><div class="bar">
  <h1>ตรวจความหมาย effect ของการ์ด</h1>
  <span class="count" id="count"></span>
  <div class="seg"><button id="fAll" class="on">ทั้งหมด</button><button id="fTodo">ยังไม่ตอบ</button></div>
  <a class="btn" href="crop.html#cards">แก้ไขการ์ด ↗</a>
  <div class="prog"><i id="prog"></i></div>
</div></header>
<main id="main"></main>
<div id="msg"></div>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const plain = s => String(s).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
  let Q = [], CARDS = {}, ANS = {}, onlyTodo = false;

  const msg = (t, bad) => { const m = $('msg'); m.textContent = t; m.className = 'show' + (bad ? ' bad' : ''); clearTimeout(msg.t); msg.t = setTimeout(() => m.className = '', 1800); };

  // answers are saved per question; merge with the file on disk so two devices don't overwrite each other
  let pending = {}, saving = null;
  function queueSave(id) { pending[id] = ANS[id]; clearTimeout(queueSave.t); queueSave.t = setTimeout(flush, 600); }
  async function flush() {
    if (saving) { await saving; }
    const batch = pending; pending = {};
    if (!Object.keys(batch).length) return;
    saving = (async () => {
      try {
        const disk = await fetch('../data/review-answers.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
        const merged = { ...disk, ...batch };
        const r = await fetch('../data/review-answers.json', { method: 'PUT', body: JSON.stringify(merged, null, 2) + '\n' });
        if (!r.ok) throw new Error(await r.text());
        ANS = { ...merged, ...ANS };
        msg('บันทึกคำตอบแล้ว ✓');
      } catch (e) { Object.assign(pending, batch); msg('บันทึกไม่ได้ — เปิดผ่าน python3 serve.py', true); }
    })();
    await saving; saving = null;
  }

  const answered = q => ANS[q.id] && (Number.isInteger(ANS[q.id].choice) || (ANS[q.id].note || '').trim());
  function progress() {
    const n = Q.filter(answered).length;
    $('count').textContent = `ตอบแล้ว ${n} / ${Q.length}`;
    $('prog').style.width = (Q.length ? n / Q.length * 100 : 0) + '%';
  }

  function cardBox(id) {
    const c = CARDS[id]; if (!c) return `<div class="card"><div class="t">${esc(id)} (ไม่พบการ์ด)</div></div>`;
    const art = c.art && (c.art.normal || c.art.fullart);
    return `<div class="card">${art ? `<img src="../${esc(art)}" alt="" loading="lazy">` : ''}<div class="t">
      <div class="n">${esc(c.id)} · ${esc(c.nameTh)} <span style="color:#8d8299">(${esc(c.nameEn)})</span></div>
      <div>${esc(c.type)} · ค่าร่าย ${c.cost}${/spell/i.test(c.type) ? '' : ` · ${c.power}/${c.health}`}</div>
      <ul>${(c.ability || []).map(a => `<li>${esc(plain(a))}</li>`).join('') || '<li>(ไม่มีความสามารถ)</li>'}</ul></div></div>`;
  }

  function render() {
    const sections = [
      ['glossary', 'ส่วนที่ 1 — คำที่ใช้ร่วมกันหลายใบ', 'ตอบครั้งเดียวมีผลกับการ์ดหลายใบ ตัวเลือกแรกคือความหมายที่ผมแนะนำ'],
      ['card', 'ส่วนที่ 2 — คำถามรายใบ', 'จุดที่ยังตีความได้หลายแบบในแต่ละการ์ด ถ้าไม่มีตัวเลือกที่ตรง เขียนในหมายเหตุได้'],
    ];
    $('main').innerHTML = sections.map(([g, title, intro]) => {
      const list = Q.filter(q => q.group === g && (!onlyTodo || !answered(q)));
      if (!list.length) return '';
      return `<h2>${title}</h2><p class="intro">${intro}</p>` + list.map(q => {
        const a = ANS[q.id] || {};
        return `<section class="q${answered(q) ? ' done' : ''}" data-q="${q.id}">
          <div class="qh"><span class="qid">${q.id}</span><div>${q.topic ? `<div class="topic">${esc(q.topic)}</div>` : ''}<div class="qt">${esc(q.text)}</div></div></div>
          ${q.card ? cardBox(q.card) : ''}
          <div class="opts">${q.options.map((o, i) => `<button class="opt${a.choice === i ? ' on' : ''}" data-i="${i}"><span class="r"></span><span>${esc(o)}${i === 0 ? '<small>แนะนำ</small>' : ''}</span></button>`).join('')}</div>
          <textarea placeholder="หมายเหตุ / คำอธิบายเพิ่ม (ไม่บังคับ)">${esc(a.note)}</textarea>
          ${q.cards ? `<div class="rel">มีผลกับ: ${q.cards.map(id => esc(id) + (CARDS[id] ? ' ' + esc(CARDS[id].nameEn) : '')).join(', ')}</div>` : ''}
        </section>`;
      }).join('');
    }).join('') || '<p class="intro">ตอบครบทุกข้อแล้ว 🎉</p>';
    progress();
  }

  $('main').addEventListener('click', e => {
    const b = e.target.closest('.opt'); if (!b) return;
    const sec = b.closest('.q'), id = sec.dataset.q, i = +b.dataset.i;
    ANS[id] = { ...(ANS[id] || {}), choice: ANS[id] && ANS[id].choice === i ? undefined : i, at: new Date().toISOString() };
    sec.querySelectorAll('.opt').forEach(o => o.classList.toggle('on', +o.dataset.i === ANS[id].choice));
    sec.classList.toggle('done', !!answered(Q.find(q => q.id === id)));
    progress(); queueSave(id);
  });
  $('main').addEventListener('input', e => {
    if (e.target.tagName !== 'TEXTAREA') return;
    const sec = e.target.closest('.q'), id = sec.dataset.q;
    ANS[id] = { ...(ANS[id] || {}), note: e.target.value, at: new Date().toISOString() };
    sec.classList.toggle('done', !!answered(Q.find(q => q.id === id)));
    progress(); queueSave(id);
  });
  $('fAll').onclick = () => { onlyTodo = false; $('fAll').classList.add('on'); $('fTodo').classList.remove('on'); render(); };
  $('fTodo').onclick = () => { onlyTodo = true; $('fTodo').classList.add('on'); $('fAll').classList.remove('on'); render(); };
  addEventListener('beforeunload', e => { if (Object.keys(pending).length) { flush(); e.preventDefault(); e.returnValue = ''; } });

  Promise.all([
    fetch('../data/review.json', { cache: 'no-store' }).then(r => r.json()),
    fetch('../data/cards.json', { cache: 'no-store' }).then(r => r.json()),
    fetch('../data/review-answers.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
  ]).then(([rev, cards, ans]) => {
    Q = rev.questions; cards.forEach(c => CARDS[c.id] = c); ANS = ans || {}; render();
  }).catch(() => { $('main').innerHTML = '<p class="intro">โหลดข้อมูลไม่ได้ — เปิดผ่าน python3 serve.py</p>'; });
</script>
</body>
</html>
